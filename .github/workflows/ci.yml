name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sa_ci_only_123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Sa_ci_only_123 -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      # Fictitious values for CI only.
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://sqlboard:sqlboard@localhost:5432/sqlboard
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      SQLBOARD_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktMzJieXRlcyE=
      SQLBOARD_ENCRYPTION_KEY_VERSION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      MYSQL_ADMIN_HOST: 127.0.0.1
      MYSQL_ADMIN_PASSWORD: root-ci-only
      MYSQL_TEST_HOST: 127.0.0.1
      MSSQL_ADMIN_HOST: 127.0.0.1
      MSSQL_ADMIN_PASSWORD: Sa_ci_only_123
      MSSQL_TEST_HOST: 127.0.0.1
      # Integration tests fail instead of skipping when a database is missing.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Banco de metadados, demo e seed
        run: bash scripts/dev-setup.sh
      - name: Demo SQL Server
        run: node scripts/demo-mssql.mjs
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
